# Feasibility probe: 2B at seq_len 65536, MBS 1, ONE node. Derived from
# configs/jupiter/qwen3_5_2b.toml; only the row length, the microbatch shape and
# the step budget differ.
#
# Caveat on what this measures: attention is varlen and confined per document, so
# with the short samples in this blend a 64K row is just more documents packed
# into one row and the attention cost is the same as at 16K. This probes memory,
# packing and compile at the longer row -- not long-context attention. For that,
# see qwen3_5_2b_64k_longdoc.toml.
[model]
model_name = "Qwen/Qwen3.5-2B"
model_config = "configs/models/qwen3_5_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3_5_2b_64k"
project_name = "qwen3_5_jupiter_prod"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/e/project1/open-sci-mm/ockier1/models/Qwen3.5-2B-Base"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/e/scratch/open-sci-mm/ockier1/checkpoints/qwen3_5_2b_64k"
save_steps = 100000   # feasibility probe: never checkpoint
total_steps = 20
random_init = false
scheduler_type = "wsd"
warmup_steps = 5
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6

# The 35B runs tp=2 ep=4 because 256 experts have to be split and a 35B forward
# does not fit otherwise. 2B dense needs neither: FSDP alone shards it, and
# tp>1 would add an all-gather/reduce-scatter per block for nothing. ep_size is
# left unset (1) -- there are no experts to parallelise. `sequence_parallel` and
# `async_tp` are tp>1 features and need no setting here: SP is gated on
# `tp > 1` at train_qwen.py:329, and async_tp defaults off.
tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
precompile = true

loss_chunks = 16

dynamo_recompile_limit = 128
tpi_multiplier = 1
adamw_impl = "foreach_sr"
adamw_stochastic_round = true
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "bfloat16"
grad_reduce_dtype = "bfloat16"
deterministic = false
clear_cache_vram = 0
selective_ac_freq = 1
selective_ac_op = false
selective_ac_vision = true

resume_checkpoint = false

[data]
data_path = "/e/project1/open-sci-mm/ockier1/metadatasets/llava_ov15_debug.yaml"
seq_len = 65536
tokens_per_microbatch = 65536   # == seq_len, so one row per microbatch (MBS 1)
shuffle_buffer_size = 500
packing_buffer_size = 250
max_samples_per_sequence = 300
repeat = false
save_dataloader_state = true

num_workers = 4
