# Qwen3.5-0.8B on JUPITER. Sibling of configs/jupiter/qwen3_5_9b.toml.
#
# 853M parameters: 752M decoder (24 layers, hidden 1024), 88M ViT and a 12.6M
# projector. The vision tower is SMALLER than the 2B's -- depth 12, hidden 768,
# intermediate 3072, 12 heads, against 24/1024/4096/16 -- so SigLIP2-large does
# NOT drop into this one. A SigLIP2 *base* variant is the matching shape; the
# `load_siglip_vision` shape check will refuse large.
#
# `num_key_value_heads = 2`, so tensor_parallel_degree cannot exceed 2 here:
# tp_size 4 dies at config build with "tensor_parallel_degree (4) must divide
# n_kv_heads (2)". The 9B config's tp_size = 4 does not carry over.
[model]
model_name = "Qwen/Qwen3.5-0.8B"
model_config = "configs/models/qwen3_5_0_8b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3_5_0_8b"
project_name = "qwen3_5_jupiter"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/e/project1/reformo/ockier1/qwen_models/qwen3_5_0_8b"
chat_template = "assets/chat_template_sft.jinja"   # keeps <think> spans for SFT
output_dir = "/e/scratch/open-sci-mm/ockier1/checkpoints/qwen3_5_0_8b"
save_steps = 1000
total_steps = 10000
random_init = false
scheduler_type = "cosine"
warmup_steps = 100
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6

# 2 is the ceiling (n_kv_heads = 2); 1 is enough for 853M on 96 GiB GH200s
tp_size = 1
sequence_parallel = false
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
tpi_multiplier = 1
adamw_impl = "fused"
adamw_stochastic_round = false
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "bfloat16"
grad_reduce_dtype = "bfloat16"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/e/scratch/open-sci-mm/ockier1/vlm_datasets/plotqa_cot"
seq_len = 16384
tokens_per_microbatch = 32768
shuffle_buffer_size = 1000
packing_buffer_size = 1000
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true
