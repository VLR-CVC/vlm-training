# Single-node debug twin of the 35B-A3B. 3.0B params, 8 layers, 64 experts.
#   CONFIG_FILE=configs/jupiter/qwen3_5_moe_debug_1n.toml \
#       sbatch --nodes=1 --ntasks=1 --time=00:30:00 scripts/multinode_jup.sh
#
# WHAT IT PRESERVES, because these are what the EP and fp8 paths depend on:
#   hidden 2048, moe_intermediate 512  -> expert GEMM is the SAME (M, 2048, 512)
#   num_experts_per_tok 8              -> same a2a volume per token
#   num_key_value_heads 2              -> same tp <= 2 ceiling
#   head_dim 256 + mrope [11,11,10]    -> same rotary layout
#   seq_len 16384                      -> same activation and attention shapes
#
# WHAT IT CUTS: 40 layers -> 8 (same 3:1 GDN/full ratio), 256 experts -> 64,
# ViT depth 27 -> 4. So compile time and memory drop ~5x while every kernel the
# big model runs still runs here, at the same shape.
#
# NOT FOR MFU NUMBERS. Per-token cost is 6.84 GFLOP vs the 35B's 22.08, because
# the embedding/lm_head and attention terms are unchanged while the layer stack
# shrank -- 10% MFU here would need ~14.5k tok/s/GPU against the 35B's 4.5k.
# Use it for correctness, compile behaviour and OOM hunting; draw throughput
# conclusions only from the real model.
#
# ep_size 4 on 4 GPUs means sparse region 4 and efsdp 1: experts split by EP
# alone, all-to-all entirely on NVLink. Use ep_size 2 to also exercise efsdp 2.
#
# random_init: the shapes do not match any snapshot, so `model_dir` is read for
# the processor/tokenizer only.
[model]
model_name = "Qwen/Qwen3.5-MoE-debug-1n"
model_config = "configs/models/qwen3_5_moe_debug_1n.json"
train_vit = true
train_llm = true
train_mlp = true
# flip to "fp8_rowwise" to debug the quantized expert GEMM; it also installs
# TorchAOTokenDispatcher with pad_multiple 16
moe_grouped_mm = "bf16"

[wandb]
run_name = "moe_debug_1n"
project_name = "qwen3_5_jupiter"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/e/project1/open-sci-mm/ockier1/models/Qwen3.5-35B-A3B"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/e/scratch/open-sci-mm/ockier1/checkpoints/moe_debug_1n"
random_init = true
save_steps = 1000
total_steps = 60
warmup_steps = 5
scheduler_type = "cosine"
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6
tp_size = 2
ep_size = 4
data_parallel = "fsdp"
reshard_after_forward = "always"
compile = true
precompile = true
dynamo_recompile_limit = 128
tpi_multiplier = 1
adamw_impl = "foreach_sr"
master_dtype = "bfloat16"
grad_reduce_dtype = "bfloat16"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/e/scratch/open-sci-mm/ockier1/vlm_datasets/plotqa_cot"
seq_len = 16384
tokens_per_microbatch = 0
shuffle_buffer_size = 100
packing_buffer_size = 100
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = false
