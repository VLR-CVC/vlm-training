# TITAN_MIGRATION_v2.md S4: torchtitan's weak-scaling workload (TORCHTITAN_BENCHMARK.md 9.1):
# plotqa_cot, TP=4+SP inside a node, FSDP across nodes, reshard_after_forward=never, no AC,
# compile, 32768 tokens per DP rank, 500 steps, fp32 master + fused AdamW as torchtitan.
# torchtitan packs two 16384 rows into one varlen micro-batch; varlen attention never crosses
# a document, so one 32768 row is the same forward. Only difference: documents 16385-32768
# tokens long are kept here and dropped there (0.1% of plotqa, PERFORMANCE.md 17.6a).
#   JUP_VENV=/e/project1/open-sci-mm/ockier1/torchtitan/venv SCALING_CONFIG=configs/jupiter/qwen3_5_9b_tp4sp_32768.toml scripts/scaling/submit_sweep.sh 4 32
# Gate: 4n >= 95% of 4,864 tok/s/GPU, peak <= 87.3 GiB; 32n efficiency within 3 points of 87.8%.
[model]
model_name = "Qwen/Qwen3.5-9B"
model_config = "configs/models/qwen3_5_9b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "titan_s4"
project_name = "titan_s4"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/e/project1/reformo/ockier1/qwen_models/qwen3_5_9b"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/e/scratch/open-sci-mm/ockier1/titan_s4"   # overridden per job
save_steps = 100000
total_steps = 500
random_init = true
scheduler_type = "cosine"
warmup_steps = 20
lr_llm = 5e-4
lr_mlp = 5e-4
lr_vit = 5e-4
tp_size = 4
sequence_parallel = true
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
tpi_multiplier = 1
adamw_impl = "fused"
adamw_stochastic_round = false
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "float32"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/e/scratch/open-sci-mm/ockier1/vlm_datasets/plotqa_cot"
seq_len = 32768
shuffle_buffer_size = 100
packing_buffer_size = 100
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = false
