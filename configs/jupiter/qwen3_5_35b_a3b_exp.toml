# Scratch copy of configs/jupiter/qwen3_5_35b_a3b.toml as it stood on 2026-10-07,
# i.e. the config behind the 64-GPU runs (tp 2, ep 4, seq 16384, ~6% MFU).
# Edit this one for experiments and leave the original as the known-good baseline.
#
# scripts/multinode_jup.sh takes CONFIG_FILE from the environment now, so:
#   CONFIG_FILE=configs/jupiter/qwen3_5_35b_a3b_exp.toml \
#       sbatch --nodes=8 --ntasks=8 scripts/multinode_jup.sh
#
# fp8 arm: `moe_grouped_mm = "fp8_rowwise"` runs the three expert GEMMs through
# torchao's rowwise-quantized `torch._scaled_grouped_mm` and switches the token
# dispatcher to `TorchAOTokenDispatcher` (which pads each group to 16, because
# torchao 0.18.0 cannot pad internally). Verified on GH200 by
# scripts/scaling/jup_fp8_check.sbatch: padding invariance exact, error
# unbiased, cos 0.9993 fwd / 0.9988 bwd against bf16.
#
# `total_steps` is bounded here so the arm ends on its own and lines up with the
# bf16 baseline (wandb gk9dlwsv: 6.16% MFU, 2810 tok/s/GPU at 64 GPUs).
[model]
model_name = "Qwen/Qwen3.5-35B-A3B"
model_config = "configs/models/qwen3_5_35b_a3b.json"
train_vit = true
train_llm = true
train_mlp = true
moe_grouped_mm = "fp8_rowwise"

[wandb]
run_name = "qwen3_5_35b_a3b_fp8"
project_name = "qwen3_5_jupiter"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/e/project1/open-sci-mm/ockier1/models/Qwen3.5-35B-A3B"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/e/scratch/open-sci-mm/ockier1/checkpoints/qwen3_5_35b_a3b_fp8"
save_steps = 1000
total_steps = 120
random_init = false
scheduler_type = "cosine"
warmup_steps = 100
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6

async_tp = true
tp_size = 2
ep_size = 4
sequence_parallel = true
data_parallel = "fsdp"
reshard_after_forward = "always"
compile = true
# OFF for the fp8 arm. fp8 adds new kernels per spec (rowwise quantize, padded
# permute, scaled grouped GEMM), all compiled and autotuned cold, so the 19
# warmup specs cost ~196s EACH -- job 2218725 spent its whole 30min walltime on
# spec 5 of 19 and trained nothing. Without it the first real steps compile
# inline, which is far cheaper because real batches hit fewer distinct shapes
# than the spec table enumerates. Turn it back on once the inductor cache is
# warm, with a walltime that can absorb ~60min of warmup.
precompile = false

dynamo_recompile_limit = 128
tpi_multiplier = 1
adamw_impl = "foreach_sr"
adamw_stochastic_round = true
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "bfloat16"
grad_reduce_dtype = "bfloat16"
deterministic = false
clear_cache_vram = 0
selective_ac_freq = 0

[data]
data_path = "/e/scratch/open-sci-mm/ockier1/vlm_datasets/plotqa_cot"
seq_len = 16384
tokens_per_microbatch = 0
shuffle_buffer_size = 1000
packing_buffer_size = 100
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true
