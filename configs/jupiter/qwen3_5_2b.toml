[model]
model_name = "Qwen/Qwen3.5-2B"
model_config = "configs/models/qwen3_5_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3_5_2b_base"
project_name = "qwen3_5_jupiter_prod"
entity_name = "ELLIOT-CVC"
log_topk = false

[training]
model_dir = "/e/project1/open-sci-mm/ockier1/models/Qwen3.5-2B-Base"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/e/scratch/open-sci-mm/ockier1/checkpoints/qwen3_5_2b"
save_steps = 250
total_steps = 1445

wsd_decay_steps = 300

random_init = false
scheduler_type = "wsd"
warmup_steps = 100
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6

tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
precompile = true

loss_chunks = 16

dynamo_recompile_limit = 128
tpi_multiplier = 1
adamw_impl = "foreach_sr"
adamw_stochastic_round = true
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "bfloat16"
grad_reduce_dtype = "bfloat16"
deterministic = false
clear_cache_vram = 0
selective_ac_freq = 1
selective_ac_op = false
selective_ac_vision = true

resume_checkpoint = true

[data]
data_path = "/e/project1/open-sci-mm/ockier1/metadatasets/llava_ov15_decay_targeted.yaml"
seq_len = 16384
tokens_per_microbatch = 65536
shuffle_buffer_size = 500
packing_buffer_size = 250
max_samples_per_sequence = 300
repeat = true

save_dataloader_state = false
restore_dataloader_state = false

num_workers = 4