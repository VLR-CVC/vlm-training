# Qwen3-VL-2B on the torchtitan components (models/qwen3_vl_tt), one JUPITER node:
# TP=4+SP, dp=1, 2 rows of 8192 tokens/rank, HF weights, fp32 master, fused AdamW, 40 steps.
#   scripts/scaling/submit_qwen3_vl_checks.sh
[model]
model_name = "Qwen/Qwen3-VL-2B"
model_config = "configs/models/qwen3_vl_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "titan_qwen3_vl_2b_smoke_1n"
project_name = "titan_qwen3_vl"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/e/project1/reformo/ockier1/qwen_models/qwen3_vl_2b"
chat_template = "NULL"   # Qwen3-VL ships no <think> handling to strip
output_dir = "/e/scratch/open-sci-mm/ockier1/titan_qwen3_vl"   # overridden per job
save_steps = 100000
total_steps = 40
random_init = false
scheduler_type = "cosine"
warmup_steps = 20
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-5
tp_size = 4
sequence_parallel = true
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
tpi_multiplier = 1
adamw_impl = "fused"
adamw_stochastic_round = false
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "float32"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/e/scratch/open-sci-mm/ockier1/vlm_datasets/plotqa_cot"
seq_len = 8192
tokens_per_microbatch = 16384   # two rows: exercises the multi-row layout
shuffle_buffer_size = 100
packing_buffer_size = 100
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true   # exercises the savable loader with the uncollated batch
