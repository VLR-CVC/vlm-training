# Midtraining arm 2/3: Qwen3-VL-2B decoder taken from the VLM checkpoint --
# weights that have already been exposed to vision-language data.
#
# This is the matched pair to configs/mn5/qwen3_vl_2b_midtraining.toml, which
# takes the same architecture's decoder from text-only Qwen3-1.7B. The two
# configs are identical in every line except `text_model_dir` and the names, so
# the difference between the runs is the decoder's exposure and nothing else.
# Qwen3-1.7B matches Qwen3-VL-2B's `text_config` on every field (28 layers,
# hidden 2048, 16 heads, 8 kv, head_dim 128, vocab 151936), which is what makes
# the pair legitimate -- and what Qwen3.5 has no equivalent of.
#
# The projector and all three DeepStack mergers
# (`deepstack_visual_indexes = [5, 11, 17]`) stay random: `load_siglip_vision`
# skips them by design, so `init_states` is what leaves them fresh.
[model]
model_name = "Qwen/Qwen3-VL-2B"
model_config = "configs/models/qwen3_vl_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3vl_decoder_vl_exposed"
project_name = "qwen3_vl_mn5_midtraining"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/qwen3vl_2b"
chat_template = "NULL"
output_dir = "/gpfs/scratch/ehpc543/qwen_finetune/qwen3_vl_2b/midtraining_vl_decoder"

load_vision_model = true
vision_model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/siglip2_large"
load_text_model = true
# the only line that differs from the base arm, which reads qwen3_1_7b_base
text_model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/qwen3vl_2b"

save_steps = 1000
total_steps = 10_000
random_init = true
scheduler_type = "wsd"
warmup_steps = 100
wsd_decay_steps = 0

lr_llm = 1e-6
lr_mlp = 1e-5
lr_vit = 1e-5

tp_size = 1
async_tp = true

data_parallel = "fsdp"
reshard_after_forward = "never"
dp_shard_size = 0

compile = false
dynamo_recompile_limit = 64
precompile = false

tpi_multiplier = 2
adamw_impl = "fused"
adamw_stochastic_round = false
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "float32"

grad_reduce_dtype = "bfloat16"
deterministic = false
clear_cache_vram = 0

resume_checkpoint = false

[data]
data_path = "/gpfs/scratch/ehpc543/metadatasets/mid_training.yaml"
seq_len = 6144
tokens_per_microbatch = 0
shuffle_buffer_size = 1000
packing_buffer_size = 500
max_samples_per_sequence = 100
repeat = false
save_dataloader_state = true
