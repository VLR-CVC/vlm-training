# Qwen3-VL-2B on MareNostrum 5: TP=4+SP per node, FSDP across nodes, one 8192-token row per DP rank.
#   scripts/multinode_mn5.sh configs/mn5/qwen3_vl_2b.toml
# NOT RUN ON MN5 YET: the environment needs spmd_types and attn_gym (the JUPITER
# torchtitan venv has them).
[model]
model_name = "Qwen/Qwen3-VL-2B"
model_config = "configs/models/qwen3_vl_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3_vl_2b"
project_name = "qwen3_vl_mn5"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/qwen3vl_2b"
chat_template = "NULL"   # Qwen3-VL template has no <think> handling to strip
output_dir = "/gpfs/scratch/ehpc543/qwen_finetune/qwen3_vl_2b"
save_steps = 1000
total_steps = 10000
random_init = false
scheduler_type = "cosine"
warmup_steps = 100
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6
tp_size = 4
sequence_parallel = true
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
tpi_multiplier = 1
adamw_impl = "foreach_sr"
adamw_stochastic_round = true
master_dtype = "bfloat16"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/gpfs/scratch/ehpc543/llava_recap"
seq_len = 8192
shuffle_buffer_size = 1000
packing_buffer_size = 1000
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true
