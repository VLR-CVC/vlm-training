# VLM creation on a Qwen3.5 decoder: SigLIP2 tower, random projector.
#
# Qwen3.5 ships no text-only release -- every size is a
# `Qwen3_5ForConditionalGeneration` -- so the decoder comes out of the VLM
# snapshot itself (`model.language_model.*`), the vision tower comes from
# SigLIP2 and the merger stays randomly initialised. `load_text_weights` reads
# only the decoder and `load_siglip_vision` deliberately skips the merger, so
# the projector is the one part that learns from scratch.
#
# SigLIP2-large and Qwen3.5-2B's own `vision_config` agree on every dimension
# (24 layers, hidden 1024, intermediate 4096, 16 heads, patch 16); only the
# position grid differs (32x32 vs 48x48) and `load_siglip_vision` resamples it.
# Qwen3.5's native tower is the same architecture, so the contrast against
# `random_init = false` with `load_*_model = false` is a clean ablation on
# pretraining rather than on capability.
[model]
model_name = "Qwen/Qwen3.5-2B"
model_config = "configs/models/qwen3_5_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3_5_2b_create"
project_name = "qwen3_5_mn5"
entity_name = "bsc_runs"
log_topk = false

[training]
# processor and tokenizer only -- the decoder weights are loaded below, and the
# `model.visual.*` half of this snapshot is deliberately left on disk
model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/qwen3_5_2b"
chat_template = "NULL"
output_dir = "/gpfs/scratch/ehpc543/qwen_finetune/qwen3_5_2b/create"

load_text_model = true
text_model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/qwen3_5_2b"
load_vision_model = true
vision_model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/siglip2_large"

save_steps = 1000
total_steps = 10000
# `load_*_model` already forces `init_states` before the two loaders run
# (train/train_qwen.py:345), so this only decides whether `load_hf` also fires
random_init = false
scheduler_type = "cosine"
warmup_steps = 100

# the projector is random, the two towers are not: give it room to catch up
lr_llm = 1e-5
lr_mlp = 1e-4
lr_vit = 1e-6

# `num_key_value_heads = 2` on this decoder, and TP must divide it -- tp_size 4
# dies at config build with "tensor_parallel_degree (4) must divide n_kv_heads
# (2)". A 2B trains on FSDP alone, so there is nothing to buy here.
tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
dp_shard_size = 0

precompile = true
compile = true
dynamo_recompile_limit = 64

tpi_multiplier = 1
adamw_impl = "fused"
adamw_stochastic_round = true
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "float32"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

selective_ac_freq = 0
selective_ac_op = false

resume_checkpoint = false

[data]
# llava_recap + olmocr_wds: caption and OCR, which is what a fresh projector
# needs before the instruct mix means anything
data_path = "/gpfs/scratch/ehpc543/metadatasets/init.yaml"
seq_len = 8192
tokens_per_microbatch = 0
shuffle_buffer_size = 500
packing_buffer_size = 100
max_samples_per_sequence = 1000
repeat = true
save_dataloader_state = true
