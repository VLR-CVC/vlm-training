[model]
model_name = "Qwen/Qwen3-VL-8B"
model_config = "configs/models/qwen3_vl_8b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3_vl_8b"
project_name = "qwen3_vl_8b"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/gpfs/scratch/ehpc543/qwen_finetune/cache_models/qwen3_vl_8b"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/gpfs/scratch/ehpc543/qwen_finetune/qwen3_vl_8b"
save_steps = 1000
total_steps = 10000
random_init = false
scheduler_type = "cosine"
warmup_steps = 100
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6

tp_size = 4
sequence_parallel = true
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true

dynamo_recompile_limit = 64
tpi_multiplier = 1
adamw_impl = "foreach_sr"
adamw_stochastic_round = true
master_dtype = "float32"
grad_reduce_dtype = "bfloat16"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/gpfs/scratch/ehpc543/synth_data/cap_pretrain"
seq_len = 8192
tokens_per_microbatch = 0
shuffle_buffer_size = 1000
packing_buffer_size = 1000
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true