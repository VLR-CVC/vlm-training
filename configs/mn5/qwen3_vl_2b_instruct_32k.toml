[model]
model_name = "Qwen/Qwen3-VL-2B"
model_config = "configs/models/qwen3_vl_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3_vl_2b_instruct"
project_name = "qwen3_vl_mn5"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/gpfs/scratch/ehpc543/qwen_finetune/final_models/midtraining"
chat_template = "NULL"
output_dir = "/gpfs/scratch/ehpc543/qwen_finetune/qwen3_vl_2b/instruct_new"

load_vision_model = false
vision_model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/siglip2_large"
load_text_model = false
text_model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/qwen3_1_7b_base"

save_steps = 1000
total_steps = 40_000
random_init = false
scheduler_type = "wsd"
warmup_steps = 100
wsd_decay_steps = 0

lr_llm = 1e-6
lr_mlp = 1e-5
lr_vit = 1e-5

tp_size = 4
async_tp = true

data_parallel = "fsdp"
reshard_after_forward = "never"
dp_shard_size = 0

precompile = true
compile = true
dynamo_recompile_limit = 64

tpi_multiplier = 1
adamw_impl = "fused"
adamw_stochastic_round = true
adam_betas = [0.9, 0.95]
weight_decay = 0.1
master_dtype = "float32"

grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

selective_ac_freq = 0
selective_ac_op = false

resume_checkpoint = false

[data]
data_path = "/gpfs/scratch/ehpc543/metadatasets/full_grouped.yaml"
seq_len = 24576
tokens_per_microbatch = 0
shuffle_buffer_size = 500
packing_buffer_size = 100
max_samples_per_sequence = 1000
repeat = false
save_dataloader_state = true