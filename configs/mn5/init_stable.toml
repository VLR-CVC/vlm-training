[model]
model_name = "Qwen/Qwen3-VL-2B-Instruct"

train_llm = false
train_mlp = true
train_vit = false

[wandb]
run_name = "test"
project_name = "mn5_llavarecap"
entity_name = "bsc_runs"

[training]
model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/qwen3vl_2b"
output_dir = "/gpfs/scratch/ehpc543/qwen_finetune/init_stable"

text_model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/qwen3_1_7b_base"
load_text_model = true

vision_model_dir = "/gpfs/scratch/ehpc543/tockier/qwen_models/siglip2_large"
load_vision_model = true

save_steps = 1000
total_steps = 5000

scheduler_type = "wsd"
warmup_steps = 25
wsd_decay_ratio = 1.0

ac_memory_budget = 0.5

lr_llm = 0
lr_mlp = 1e-3
lr_vit = 0

data_parallel = 'ddp'
tp_size = 1

tpi_multiplier = 1
compile = true

resume_checkpoint = false

# ===========================================================================
# Performance stack. See PRODUCTION.md for what each one bought and where.
# ===========================================================================

### Chunked cross-entropy. Caps the fp32 working set inside the loss. At
### Qwen3-VL-2B's 151,669-token vocabulary a 6144-token row upcasts to ~3.8 GiB
### without it. Same arithmetic, chunked -- no numerics change.
loss_chunk_mb = 512

### The vision tower's patch count is its leading dimension and changes nearly
### every step, so a static trace recompiles until it evicts its cache. Measured
### neutral on VL-8B; the tower is 47% of forward at 2B, so it matters more here.
compile_vision = "dynamic"

### Skip autotuning the vocabulary-wide lm_head GEMM. Compile time spent on a
### kernel that is not the bottleneck.
compile_head_mode = "off"

### Zero the gradients for a step whose total norm is non-finite instead of
### letting one transient poison the weights. ~1 per 300 steps at 64 ranks on
### JUPITER, no measurable cost. Cheap insurance on a 50k-step run.
skip_nonfinite_grads = true

### NUMERICS CHANGE -- read PRODUCTION.md before a long run.
### bf16 master weights (8 B/param instead of 16) plus AdamW with stochastic
### rounding, which is what makes bf16 master trainable at these learning rates.
### +41% throughput single-node on the 9B. Validated by unit tests and by loss
### curves on synthetic data; NOT yet A/B'd against the current optimizer on
### real MN5 data.
adamw_impl = "foreach_sr"
adamw_stochastic_round = true
master_dtype = "bfloat16"

[data]
data_path = "/gpfs/scratch/ehpc543/metadatasets/init.yaml"
seq_len = 4096

packing_buffer_size = 1_000
batch_size = 0

repeat = true