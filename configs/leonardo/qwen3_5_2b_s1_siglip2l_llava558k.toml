# Stage-1 adapter training on Leonardo: Qwen3.5-2B decoder + google/siglip2-large-patch16-512
# vision tower (both frozen) + randomly initialised projector (merger), LLaVA-ReCap-558K.
#   CONFIG_FILE=configs/leonardo/qwen3_5_2b_s1_siglip2l_llava558k.toml \
#     sbatch --nodes=8 --qos=qos_llm_prod --time=12:00:00 scripts/multinode_leo.sh
# load_text_model/load_vision_model -> init_states() on everything, then the decoder is loaded
# from the qwen35_2b VLM snapshot (decoder only) and the ViT from SigLIP2 (patch embed inflated
# to Conv3d, pos_embed 32x32 -> 48x48 bilinear, pooling head dropped); the merger stays random.
# Schedule follows the reference S1 run: 2445 steps, GBS 256 x 8192 (MBS 1 x DP 32 x GA 8),
# cosine 2e-3 -> 1e-7 with 73 warmup steps, betas 0.9/0.95, wd 0.01, clip 1.0, no recompute,
# packing buffer 512. Optimizer is our AdamW (the reference used Muon).
[model]
model_name = "Qwen/Qwen3.5-2B"
model_config = "configs/models/qwen3_5_2b.json"
train_vit = false
train_llm = false
train_mlp = true

[wandb]
run_name = "qwen3_5_2b_s1_siglip2l_llava558k"
project_name = "qwen3_5_leonardo"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/leonardo_scratch/fast/EUHPC_E07_125/ockier1/models/qwen35_2b"  # processor + decoder weights
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/leonardo_scratch/large/userexternal/tockierp/checkpoints/qwen3_5_2b_s1_siglip2l_llava558k"
load_text_model = true
text_model_dir = "/leonardo_scratch/fast/EUHPC_E07_125/ockier1/models/qwen35_2b"
load_vision_model = true
vision_model_dir = "/leonardo_scratch/fast/EUHPC_E07_125/ockier1/models/siglip2_large_patch16_512"
total_steps = 2445
warmup_steps = 73
save_steps = 500
scheduler_type = "cosine"
lr_mlp = 2e-3
min_lr_ratio = 5e-5  # 2e-3 -> 1e-7
lr_llm = 1e-5  # frozen
lr_vit = 2e-6  # frozen
adam_betas = [0.9, 0.95]
weight_decay = 0.01
max_grad_norm = 1.0
selective_ac_freq = 0  # no recompute
tpi_multiplier = 8  # GA 8
tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
precompile = true
dynamo_recompile_limit = 64
adamw_impl = "foreach_sr"
master_dtype = "bfloat16"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "configs/leonardo/llava_recap_558k.yaml"
seq_len = 8192
microbatch_size = 1
tokens_per_microbatch = 0
shuffle_buffer_size = 1000
packing_buffer_size = 512
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true
