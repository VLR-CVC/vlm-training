# Single-stage S2+S3 ablation (7.0B tokens) with the full-epoch run's data distribution: same pools
# and weights as s23_full_epoch_mix.yaml (midtrain_v2_ocrp_mix 0.6175 / sft_pool_v12_b3v13_mix 0.3825,
# sample fractions proportional to pool size).
__module__: megatron.energon
__class__: MetadatasetV2
splits:
  train:
    blend:
      - path: midtrain_v2_ocrp_mix.yaml
        weight: 0.6175
      - path: sft_pool_v12_b3v13_mix.yaml
        weight: 0.3825
