# Engram on a frozen Qwen3.5-0.8B: continued pretraining of the memory alone.
#
#   CUDA_VISIBLE_DEVICES=0,1 ./scripts/finetune.sh --config configs/text/qwen3_5_0_8b_engram.toml
#
# * The text-only model (`qwen3_5_text`) loads the stock multimodal snapshot: the
#   state-dict adapter reads its `model.language_model.*` names and never asks
#   for the tower.
# * `train_llm = false, train_engram = true`: only `engram.*` trains. W_V starts
#   at zero, so step 0 is exactly the base model's loss.
# * One Engram module after decoder layer 2: orders {2,3} x 8 heads, 262,147+
#   rows per head, 64-wide heads (concat = hidden size 1024) -> 4.2M rows,
#   270M table parameters. fp32 master + Adam: ~4.3 GB of state.
# * data_path: two FineWeb-Edu 10BT shards (~1B tokens train) re-indexed for
#   this project -- a placeholder; T03/T04 provide the real shards. (The shared
#   `fineweb_edu_text` view has owner-only .idx files.) `pretrain = true`: raw
#   text, loss on every token.
[model]
model_name = "Qwen/Qwen3.5-0.8B+engram"
model_config = "configs/models/qwen3_5_0_8b_text.json"
train_llm = false
train_mlp = false
train_vit = false
engram = true
train_engram = true
engram_layers = [2]
engram_orders = [2, 3]
engram_heads = 8
engram_rows_per_head = 262144

[wandb]
run_name = "qwen3_5_0_8b_engram"
project_name = "ngram"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/data/151-2/users/allabres/huggingface/hub/models--Qwen--Qwen3.5-0.8B/snapshots/2fc06364715b967f1860aea9cf38778875588b17"
output_dir = "/data/151-1/users/allabres/n-gram/checkpoints/qwen3_5_0_8b_engram"
random_init = false
save_steps = 1000
total_steps = 200
warmup_steps = 20
scheduler_type = "wsd"
wsd_decay_ratio = 0.1
lr_engram = 1e-3
max_grad_norm = 1.0
weight_decay = 0.01
tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
loss_chunks = 8
tpi_multiplier = 1
# fp32 master weights for the table: bf16 masters would round small updates to
# rarely-hit rows away
adamw_impl = "foreach"
master_dtype = "float32"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/data/151-2/users/allabres/n-gram/data/fineweb_edu_smoke"
pretrain = true
seq_len = 4096
tokens_per_microbatch = 16384
shuffle_buffer_size = 1000
packing_buffer_size = 1000
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true
