# Qwen3.5-2B decoder, PRETRAINED FROM SCRATCH, on the 4 local 96 GiB cards.
#   scripts/local_text_4gpu.sh
#
# Local rehearsal of configs/mn5/text/qwen3_5_2b_pretrain.toml: same data path
# (`pretrain = true`), same schedule shape, same optimizer, so a loss curve here
# is the one MN5 will draw. Differences are only what the box forces --
# 4 ranks instead of 16, a shorter run, and the local dataset copy.
[model]
model_name = "Qwen/Qwen3.5-2B-text"
model_config = "configs/models/qwen3_5_2b_text.json"
attention_kind = ""   # the snapshot's own hybrid schedule; "softmax"/"gdn" force a uniform one
train_llm = true
train_mlp = true
train_vit = false

[wandb]
run_name = "qwen3_5_2b_pretrain_local"
project_name = "qwen3_5_text"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/data/151-1/users/tockier/qwen_finetune/cache/qwen35_2b"
chat_template = "assets/chat_template_sft.jinja"   # unused when data.pretrain
output_dir = "/data/151-2/users/tockier/qwen_finetune/checkpoints/qwen3_5_2b_pretrain"
save_steps = 1000
random_init = true

# Tokens per optimizer step = microbatch_tokens * 4 ranks * tpi = 65536.
# 5000 steps is ~0.33B tokens: enough to see whether the curve is healthy,
# not a budget. Warmup is held at 5% as on MN5 so the shapes match.
total_steps = 5000
scheduler_type = "cosine"
warmup_steps = 250
min_lr_ratio = 0.1

lr_llm = 3e-4
lr_mlp = 3e-4
lr_vit = 1e-6
weight_decay = 0.1
adam_betas = [0.9, 0.95]
max_grad_norm = 1.0

tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
tpi_multiplier = 1

selective_ac_freq = 1
selective_ac_op = true

adamw_impl = "foreach_sr"
adamw_stochastic_round = true
master_dtype = "bfloat16"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
pretrain = true
data_path = "/data/151-2/users/tockier/datasets/fineweb_edu_text"
seq_len = 8192
tokens_per_microbatch = 16384
shuffle_buffer_size = 1000
packing_buffer_size = 1000
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true
