# Engram on a frozen Qwen3.5-2B: continued pretraining of the memory alone.
# Same recipe as `qwen3_5_0_8b_engram.toml` at the size results are reported on.
#
#   CUDA_VISIBLE_DEVICES=0,1 ./scripts/finetune.sh --config configs/text/qwen3_5_2b_engram.toml
#
# One Engram module after decoder layer 2: orders {2,3} x 8 heads, 1,048,576+
# rows per head, 128-wide heads (concat = hidden size 2048) -> 16.8M rows,
# 2.15B table parameters. That is past what one GPU holds comfortably with fp32
# master + Adam (~34 GB of state, plus a dense fp32 gradient); with FSDP it is
# sharded over the DP ranks, but every rank still all-gathers the full bf16
# table (4.3 GB) for the step. Lower `engram_rows_per_head` for a single GPU.
# data_path is a placeholder (T03/T04 provide the real shards).
[model]
model_name = "Qwen/Qwen3.5-2B+engram"
model_config = "configs/models/qwen3_5_2b_text.json"
train_llm = false
train_mlp = false
train_vit = false
engram = true
train_engram = true
engram_layers = [2]
engram_orders = [2, 3]
engram_heads = 8
engram_rows_per_head = 1048576

[wandb]
run_name = "qwen3_5_2b_engram"
project_name = "ngram"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/data/151-2/users/allabres/huggingface/hub/models--Qwen--Qwen3.5-2B/snapshots/15852e8c16360a2fea060d615a32b45270f8a8fc"
output_dir = "/data/151-2/users/allabres/n-gram/checkpoints/qwen3_5_2b_engram"
random_init = false
save_steps = 1000
total_steps = 10000
warmup_steps = 200
scheduler_type = "wsd"
wsd_decay_ratio = 0.1
lr_engram = 1e-3
max_grad_norm = 1.0
weight_decay = 0.01
tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "always"
compile = true
dynamo_recompile_limit = 64
loss_chunks = 8
tpi_multiplier = 1
adamw_impl = "foreach"
master_dtype = "float32"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/data/151-2/users/tockier/datasets/fineweb_edu_text"
pretrain = true
seq_len = 4096
tokens_per_microbatch = 16384
shuffle_buffer_size = 1000
packing_buffer_size = 1000
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true
