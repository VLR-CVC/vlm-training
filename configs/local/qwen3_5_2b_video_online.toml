# Qwen3.5-2B on local RTX PRO 6000 (GPUs 2,3, FSDP) — online video decoding via Energon v8 AVDecoder (`video`).
#   CUDA_VISIBLE_DEVICES=2,3 scripts/finetune.sh --config configs/local/qwen3_5_2b_video_online.toml
[model]
model_name = "Qwen/Qwen3.5-2B"
model_config = "configs/models/qwen3_5_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "qwen3_5_2b_video_online"
project_name = "qwen3_5_local"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/data/151-1/users/tockier/qwen_finetune/cache/qwen35_2b"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/data/151-2/users/tockier/qwen_finetune/checkpoints/qwen3_5_2b_video_online"
save_steps = 1000
total_steps = 20
random_init = false
scheduler_type = "cosine"
warmup_steps = 5
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6
tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
tpi_multiplier = 1
adamw_impl = "foreach"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/data/151-2/users/tockier/datasets/llava_video_178k/wds_activitynet_raw"
seq_len = 8192
shuffle_buffer_size = 64
packing_buffer_size = 64
max_samples_per_sequence = 100
video_fps = 2.0
video_max_frames = 32
video_max_side = 448
num_workers = 2
repeat = true
save_dataloader_state = false
