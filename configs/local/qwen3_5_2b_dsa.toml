# Qwen3.5-2B decoder with the DSA sparse-attention backend, ONE local card.
#   scripts/local_dsa_1gpu.sh
#
# Smoke test for `attn_backend = "dsa"` end to end: real data, real optimizer,
# `compile = true` so the per-block `fullgraph=False` path is exercised, and
# `selective_ac_freq = 1` so the indexer side loss is recomputed in backward.
#
# A copy of configs/text/qwen3_5_2b_pretrain.toml, cut to fit a single card
# that is shared with other jobs: 1 rank, half the microbatch, 20 steps.
# `random_init = true` matters here -- released snapshots carry no indexer
# weights, so a loaded checkpoint would need them initialized separately.
[model]
model_name = "Qwen/Qwen3.5-2B-text"
model_config = "configs/models/qwen3_5_2b_text.json"
attention_kind = ""   # the snapshot's own hybrid schedule
attn_backend = "dsa"
train_llm = true
train_mlp = true
train_vit = false

[dsa]
# 2048 over 8192-token rows: fineweb documents are mostly far shorter than the
# budget, so most segments take the dense branch and still pay the indexer
# loss. Dropped from the 2048 default only where the row is long enough to
# matter, which is the point of the knob.
index_topk = 1024
min_sparse_len = 0
loss_coeff = 1.0

[wandb]
run_name = "qwen3_5_2b_dsa_smoke"
project_name = "qwen3_5_text"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/data/151-1/users/tockier/qwen_finetune/cache/qwen35_2b"
chat_template = "assets/chat_template_sft.jinja"   # unused when data.pretrain
output_dir = "/data/151-2/users/tockier/qwen_finetune/checkpoints/qwen3_5_2b_dsa_smoke"
save_steps = 1000   # above total_steps: no checkpoint written
random_init = true

total_steps = 20
scheduler_type = "cosine"
warmup_steps = 2
min_lr_ratio = 0.1

lr_llm = 3e-4
lr_mlp = 3e-4
lr_vit = 1e-6
weight_decay = 0.1
adam_betas = [0.9, 0.95]
max_grad_norm = 1.0

tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
tpi_multiplier = 1

selective_ac_freq = 1
selective_ac_op = true

adamw_impl = "foreach_sr"
adamw_stochastic_round = true
master_dtype = "bfloat16"
grad_reduce_dtype = "float32"
deterministic = false
clear_cache_vram = 0

[data]
pretrain = true
data_path = "/data/151-2/users/tockier/datasets/fineweb_edu_text"
seq_len = 8192
tokens_per_microbatch = 8192
shuffle_buffer_size = 1000
packing_buffer_size = 1000
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = false
