# Regression check for the titan-path data-exhaustion fix: two DP ranks,
# repeat = false and 3 micro-batches per step on a 60-sample plotqa copy, so a
# rank runs out of data partway through an accumulation window within a few
# steps. Before the fix that rank left the loop alone and the other hung in the
# token-count all_reduce; now every rank must stop at the same step.
[model]
model_name = "Qwen/Qwen3.5-2B"
impl = "titan"
model_config = "configs/models/qwen3_5_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "titan_exhaustion"
project_name = "titan_migration"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/data/151-1/users/tockier/qwen_finetune/cache/qwen35_2b"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/data/151-2/users/tockier/qwen_finetune/checkpoints/titan_exhaustion"
save_steps = 100000
total_steps = 1000
random_init = true
scheduler_type = "cosine"
warmup_steps = 2
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6
tp_size = 1
data_parallel = "fsdp"
reshard_after_forward = "never"
compile = false
tpi_multiplier = 3
adamw_impl = "foreach_sr"
master_dtype = "bfloat16"
deterministic = false
clear_cache_vram = 0

[data]
data_path = "/data/151-2/users/tockier/datasets/plotqa_tiny"
seq_len = 8192
shuffle_buffer_size = 10
packing_buffer_size = 10
max_samples_per_sequence = 10
batch_size = 0
repeat = false
save_dataloader_state = false
