# TITAN_MIGRATION_v2.md S2: models/qwen3_5_tt through train_qwen.py on the local
# RTX PRO 6000 cards. Checks the wiring (loss normalisation, FSDP/replicate, resume),
# not a recipe.
[model]
model_name = "Qwen/Qwen3.5-2B"
model_config = "configs/models/qwen3_5_2b.json"
train_vit = true
train_llm = true
train_mlp = true

[wandb]
run_name = "titan_s2_2b_2gpu_ddp"
project_name = "titan_migration"
entity_name = "bsc_runs"
log_topk = false

[training]
model_dir = "/data/151-1/users/tockier/qwen_finetune/cache/qwen35_2b"
chat_template = "assets/chat_template_sft.jinja"
output_dir = "/data/151-2/users/tockier/qwen_finetune/checkpoints/titan_s2_2b_2gpu_ddp"
save_steps = 1000
total_steps = 30
random_init = false
scheduler_type = "cosine"
warmup_steps = 5
lr_llm = 1e-5
lr_mlp = 1e-5
lr_vit = 1e-6
tp_size = 1
data_parallel = "ddp"
reshard_after_forward = "never"
compile = true
dynamo_recompile_limit = 64
tpi_multiplier = 2
adamw_impl = "foreach_sr"
master_dtype = "bfloat16"
grad_reduce_dtype = "float32"
clear_cache_vram = 0

[data]
data_path = "/data/151-1/datasets/llava_recap"
seq_len = 8192
shuffle_buffer_size = 100
packing_buffer_size = 100
max_samples_per_sequence = 100
repeat = true
save_dataloader_state = true
